<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Algorithm Visualizer</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --ink: #1d2330; --muted: #5d6677; --line: #dde1e8;
    --normal: #4c78a8; --compare: #f2cf5b; --swap: #e45756; --pivot: #b279a2;
    --sorted: #54a24b; --range: #9ecae9; --accent: #2f5d8a; --hl: #fff1b8; --hl-ink: #1d2330;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14171d; --panel: #1c2028; --ink: #e6e9ef; --muted: #98a1b2; --line: #2c323d;
            --accent: #7fb0e0; --hl: #5a4a12; --hl-ink: #fff6d6; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  main { max-width: 1200px; margin: 0 auto; padding: 20px 16px 32px; }
  h1 { font-size: 20px; margin: 0 0 2px; }
  .sub { color: var(--muted); margin: 0 0 16px; font-size: 13px; }
  .controls { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: end; background: var(--panel);
              border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
  label { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--muted); }
  select, input[type=number] { font: inherit; padding: 5px 7px; border: 1px solid var(--line); border-radius: 6px;
              background: var(--bg); color: var(--ink); max-width: 100%; }
  input[type=number] { width: 80px; }
  input[type=text] { font: inherit; padding: 5px 7px; border: 1px solid var(--line); border-radius: 6px;
              background: var(--bg); color: var(--ink); width: 230px; max-width: 100%; }
  .values { display: flex; gap: 6px; align-items: end; flex-wrap: wrap; }
  input[type=range] { width: 110px; }
  .buttons { display: flex; gap: 6px; flex-wrap: wrap; }
  button { font: inherit; padding: 6px 12px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg);
           color: var(--ink); cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; min-width: 84px; }
  button:disabled { opacity: .45; cursor: default; }

  .status { margin: 12px 2px 0; font-weight: 600; min-height: 1.4em; }
  .status .win { color: var(--sorted); }
  .views { display: grid; gap: 12px; margin-top: 10px; }
  .view { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
  .view h2 { font-size: 15px; margin: 0; }
  .view .cx { color: var(--muted); font-size: 12px; margin: 0 0 8px; }
  .body { display: grid; grid-template-columns: minmax(0, 1fr) 450px; gap: 12px; }
  canvas { width: 100%; height: 340px; display: block; }
  .race canvas { height: 200px; }
  .stats { font-variant-numeric: tabular-nums; color: var(--muted); white-space: pre-wrap; font-size: 13px; margin-top: 6px; }
  .note { min-height: 1.4em; font-size: 14px; }
  ol.code { margin: 0; padding: 6px 0; list-style: none; counter-reset: ln; background: var(--bg);
            border: 1px solid var(--line); border-radius: 8px; overflow: auto; max-height: 340px;
            font: 12px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .race ol.code { max-height: 200px; }
  ol.code li { counter-increment: ln; white-space: pre; padding: 0 10px; color: var(--muted); }
  ol.code li::before { content: counter(ln); display: inline-block; width: 2.2em; opacity: .55; }
  ol.code li.on { background: var(--hl); color: var(--hl-ink); }
  .legend { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 12px; font-size: 12px; color: var(--muted); }
  .legend span::before { content: ""; display: inline-block; width: 11px; height: 11px; border-radius: 2px;
                         margin-right: 5px; vertical-align: -1px; background: var(--c); }
  .error { color: var(--swap); }
  @media (max-width: 760px) {
    .body { grid-template-columns: 1fr; }
    canvas, .race canvas { height: 200px; }
  }
</style>
</head>
<body>
<main>
  <h1>Algorithm Visualizer</h1>
  <p class="sub">The steps and pseudocode come from the Java classes (<code>Algorithm.run()</code>) and are played back here.
     Pick a second algorithm under "Race against" to run both on the same array.</p>

  <div class="controls">
    <label>Algorithm <select id="algo"></select></label>
    <label>Race against <select id="vs"></select></label>
    <label>Array type <select id="kind"></select></label>
    <label>Size <span><input id="size" type="range" min="5" max="100" value="30"> <b id="sizeVal">30</b></span></label>
    <label>Speed <input id="speed" type="range" min="1" max="100" value="40"></label>
    <label>Target <input id="target" type="number" placeholder="random"></label>
    <div class="buttons">
      <button id="start" class="primary">Start</button>
      <button id="prev">Prev</button>
      <button id="next">Next</button>
      <button id="reset">Reset</button>
      <button id="fresh">New array</button>
    </div>
    <div class="values">
      <label>Your values <input id="values" type="text" placeholder="e.g. 5, 3, 8, 1"
             title="2 to 100 whole numbers from 0 to 999, separated by commas or spaces"></label>
      <button id="use">Use values</button>
    </div>
  </div>

  <div class="status" id="status"></div>
  <div class="views" id="views"></div>

  <div class="legend">
    <span style="--c:var(--normal)">Normal</span>
    <span style="--c:var(--compare)">Being compared</span>
    <span style="--c:var(--swap)">Swap / write</span>
    <span style="--c:var(--pivot)">Pivot / middle / heap parent</span>
    <span style="--c:var(--range)">Active range</span>
    <span style="--c:var(--sorted)">Sorted / found</span>
  </div>
</main>

<script>
// Role ordinals, same order as Role.java: NORMAL, COMPARE, SWAP, PIVOT, SORTED, FOUND, RANGE
const ROLE_VARS = ["--normal", "--compare", "--swap", "--pivot", "--sorted", "--sorted", "--range"];
const $ = id => document.getElementById(id);
let algos = [], data = null, views = [], time = 0, timer = null;

async function init() {
  const meta = await (await fetch("/api/algorithms")).json();
  algos = meta.algorithms;
  for (const a of algos) $("algo").add(new Option(a.name, a.name));
  for (const k of meta.kinds) $("kind").add(new Option(k.label, k.id));
  // Optional link parameters, e.g. ?algo=Bubble Sort&vs=Merge Sort&kind=REVERSED&size=40 or &values=5,3,8,1
  const url = new URLSearchParams(location.search);
  const pick = (id, value) => { if (value && [...$(id).options].some(o => o.value === value)) $(id).value = value; };
  pick("algo", url.get("algo"));
  pick("kind", url.get("kind"));
  if (url.get("values")) $("values").value = url.get("values");
  if (url.get("size")) { $("size").value = url.get("size"); $("sizeVal").textContent = $("size").value; }
  fillVs();
  pick("vs", url.get("vs"));
  $("algo").onchange = () => { fillVs(); load(); };
  $("vs").onchange = load;
  $("kind").onchange = generated;
  $("size").oninput = () => { $("sizeVal").textContent = $("size").value; };
  $("size").onchange = generated;
  $("target").oninput = load;
  $("speed").oninput = () => { if (timer) { stop(); play(); } };
  $("start").onclick = startPause;
  $("next").onclick = () => { stop(); $("start").textContent = "Resume"; seek(time + 1); };
  $("prev").onclick = () => { stop(); $("start").textContent = "Resume"; seek(time - 1); };
  $("reset").onclick = () => { stop(); seek(0); $("start").textContent = "Start"; };
  $("fresh").onclick = generated;
  $("use").onclick = load;
  $("values").onkeydown = e => { if (e.key === "Enter") load(); };
  window.onresize = () => views.forEach(drawView);
  load();
}

// Array type, size and "New array" switch back from typed values to a generated array.
function generated() { $("values").value = ""; load(); }

// "Race against" only offers algorithms of the same kind (sort vs sort, search vs search).
function fillVs() {
  const first = algos.find(a => a.name === $("algo").value), keep = $("vs").value;
  $("vs").length = 0;
  $("vs").add(new Option("(no race)", ""));
  for (const a of algos) if (a.name !== first.name && a.needsTarget === first.needsTarget) $("vs").add(new Option(a.name, a.name));
  if ([...$("vs").options].some(o => o.value === keep)) $("vs").value = keep;
}

let loadId = 0;
async function load() {
  stop();
  const id = ++loadId;
  const first = algos.find(a => a.name === $("algo").value);
  $("target").disabled = !first.needsTarget;
  const p = new URLSearchParams({ algo: first.name, vs: $("vs").value, kind: $("kind").value,
                                  size: $("size").value, target: $("target").value, values: $("values").value });
  const res = await fetch("/api/run?" + p);
  const body = await res.json();
  if (id !== loadId) return;                       // a newer request has started
  if (!res.ok) { $("status").innerHTML = '<span class="error">' + body.error + "</span>"; return; }
  data = body;
  buildViews();
  $("start").textContent = "Start";
  seek(0);
}

function buildViews() {
  const box = $("views");
  box.innerHTML = "";
  box.classList.toggle("race", data.runs.length > 1);
  views = data.runs.map(run => {
    const el = document.createElement("section");
    el.className = "view";
    el.innerHTML = '<h2></h2><p class="cx"></p><div class="body"><div><canvas></canvas>'
                 + '<div class="stats"></div><div class="note"></div></div><ol class="code"></ol></div>';
    el.querySelector("h2").textContent = run.name;
    el.querySelector(".cx").textContent = run.complexity;
    const ol = el.querySelector("ol");
    for (const line of run.code) { const li = document.createElement("li"); li.textContent = line; ol.append(li); }
    box.append(el);
    return { run, el, canvas: el.querySelector("canvas"), lines: [...ol.children], index: -1 };
  });
}

// One shared clock: each view shows frame min(time, its length).
const longest = () => Math.max(...views.map(v => v.run.steps.length));
const finished = () => time >= longest();

function seek(t) {
  if (!data) return;
  time = Math.max(0, Math.min(longest(), t));
  for (const v of views) {
    v.index = Math.min(time, v.run.steps.length) - 1;
    const s = v.index >= 0 ? v.run.steps[v.index] : null, done = v.index === v.run.steps.length - 1;
    drawView(v);
    v.el.querySelector(".stats").textContent = "Comparisons: " + (s ? s.c : 0) + "    Writes: " + (s ? s.w : 0)
        + "    Step " + (v.index + 1) + " / " + v.run.steps.length + (done ? "    (done)" : "");
    v.el.querySelector(".note").textContent = s ? s.n : "Press Start";
    v.lines.forEach((li, i) => li.classList.toggle("on", s !== null && s.l === i + 1));
    const on = v.lines[s ? s.l - 1 : -1];
    if (on) on.scrollIntoView({ block: "nearest" });
  }
  $("prev").disabled = time <= 0;
  $("next").disabled = finished();
  $("status").innerHTML = status();
}

// Same rule as Race.java: fewer steps finishes first; ties go to less work (comparisons + writes).
function status() {
  let text = data.target !== null ? "Target: " + data.target + "&nbsp;&nbsp;&nbsp; " : "";
  if (views.length < 2) return text;
  const [a, b] = views, doneA = a.index === a.run.steps.length - 1, doneB = b.index === b.run.steps.length - 1;
  const last = v => v.run.steps[v.run.steps.length - 1], work = v => last(v).c + last(v).w;
  if (!doneA && !doneB) return text + "Race: " + a.run.name + " vs " + b.run.name;
  if (doneA !== doneB) return text + (doneA ? a : b).run.name + " finished first, after " + (doneA ? a : b).run.steps.length + " steps";
  const order = (a.run.steps.length - b.run.steps.length) || (work(a) - work(b));
  const detail = a.run.steps.length + " vs " + b.run.steps.length + " steps, " + last(a).c + " vs " + last(b).c
               + " comparisons, " + last(a).w + " vs " + last(b).w + " writes";
  if (order === 0) return text + "Tie (" + detail + ")";
  return text + '<span class="win">' + (order < 0 ? a : b).run.name + " wins</span> (" + detail + ")";
}

function startPause() {
  if (timer) { stop(); $("start").textContent = "Resume"; return; }
  if (finished()) seek(0);
  play();
}
function play() {
  $("start").textContent = "Pause";
  timer = setInterval(() => {
    if (finished()) { stop(); $("start").textContent = "Start"; return; }
    seek(time + 1);
  }, Math.max(1, 600 / $("speed").value));
}
function stop() { clearInterval(timer); timer = null; }

function drawView(v) {
  const c = v.canvas, dpr = window.devicePixelRatio || 1;
  c.width = c.clientWidth * dpr; c.height = c.clientHeight * dpr;
  const g = c.getContext("2d"); g.scale(dpr, dpr);
  const W = c.clientWidth, H = c.clientHeight;
  g.clearRect(0, 0, W, H);
  const s = v.index >= 0 ? v.run.steps[v.index] : null;
  const arr = s ? s.d : data.start, n = arr.length;
  const css = getComputedStyle(document.documentElement);
  const colours = ROLE_VARS.map(x => css.getPropertyValue(x).trim());
  const max = Math.max(1, ...arr), bw = W / n, labels = n <= 30 && bw >= 14, usable = H - (labels ? 22 : 4);
  g.font = "11px system-ui"; g.textAlign = "center";
  for (let i = 0; i < n; i++) {
    const h = Math.max(2, arr[i] / max * usable), x = i * bw;     // 0 still shows a sliver
    g.fillStyle = colours[s ? +s.r[i] : 0];
    g.fillRect(x + 1, usable - h + 2, Math.max(1, bw - 2), h);
    if (labels) { g.fillStyle = css.getPropertyValue("--muted"); g.fillText(arr[i], x + bw / 2, H - 6); }
  }
}

init().catch(e => { $("status").innerHTML = '<span class="error">Could not reach the Java server: ' + e + "</span>"; });
</script>
</body>
</html>
